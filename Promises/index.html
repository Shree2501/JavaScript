<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>
<body>
    
</body>
<script>
    const myPromise = new Promise(function(resolve, reject){
        setTimeout(function(){
            console.log("Async part is consumed");
            resolve()
        }, 1000);
    });
    myPromise.then(function(){
        console.log("Promise resolved");
    })

    new Promise(function(resolve,reject){
        setTimeout(function(){
            console.log("Async 2 consumed");
            resolve()
        },1000)
    }).then(function(){
        console.log("Promise 2 resolved");
    })

    const Promise2 = new Promise(function(resolve, reject){
        setTimeout(function(){
            resolve({username: "user1", email: "user1@example.com"})
        }, 1000);
    });
    Promise2.then(function(user){
        console.log(user);
    })

    const promise3 = new Promise(function(resolve, reject){
        setTimeout(function(){
            const error = false;
            if(!error){
                resolve({id: 1, message: "Success"});
            } else {
                reject("Error: Something went wrong");
            }
        }, 1000);
    });
    promise3.then((data)=>{
        console.log(data);
        return data.message;
    }).then((message)=>{
        console.log(message);     
    }).catch((err)=>{
        console.log(err);
    }).finally(() => {
        console.log("Promise3 is either resolved or rejected");
    });

    const promise4 = new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve({username: "user4", password: "pass4"});
        }, 1000);
    });
    async function consumePromise4() {
        try{
            const user = await promise4;
            console.log(user);
        } catch(err) {
            console.log(err);
        }   
    }
    consumePromise4();

        .then((response) => {
            return response.json();
        })
        .then((posts) => {
            console.log(posts);
        })
        .catch((err) => console.log(err));

</script>
</html>
