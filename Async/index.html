<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>
<body>
    <h1>Hey !</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const change = function(){
        document.querySelector('h1').
        innerHTML = "Shree"
        console.log("c");       
    }
    let c
    const str = document.querySelector('#start').addEventListener('click',function(){
        c = setInterval(change,1000)
        console.log("Started");
    })
    document.querySelector('#stop').addEventListener('click',function(){
        console.log("Stoped")
        clearInterval(c)
    })
</script>
</html>
